name: Release

on:
  push:
    tags: ['v*']
  # orchestrator（aster-lang-platform/release-train.yml）入口：dispatch 只创建并
  # push tag（用 CROSS_REPO_TOKEN，PAT 才能让 tag-push 再触发 publish——GITHUB_TOKEN
  # 推的 tag 不会触发 workflow）。真正 publish 仍只走下面的 tag-push 路径，保留
  # tag==version gate 与既有发布语义。详见 ADR 0023 阶段2。
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本（不含 v 前缀），须等于 build.gradle.kts 的 version'
        required: true
        type: string
      artifactIds:
        description: 'release-plan 的 artifact id 列表（逗号分隔，审计用）'
        required: false
        type: string
      trainId:
        description: 'release train 标识（审计用）'
        required: false
        type: string
      forceTests:
        description: '发布 run 跑完整测试而不要求 main CI 已通过（ADR 0053 修订 A2）'
        required: false
        type: boolean
        default: false

# dispatch(vX) 与 tag-push(vX) 用同一 concurrency group（inputs.version 不含 v 前缀，
# 补 format 成 vX 对齐 ref_name），串行化同版本的 create-tag 与 publish。
concurrency:
  group: release-${{ github.repository }}-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  # dispatch 路径：仅创建 tag（用 PAT），让既有 tag-push publish 复用。
  create-tag:
    # 仅允许从默认分支 dispatch，避免给某个 version 恰好匹配的 feature 分支 HEAD 打 release tag。
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 0
      - name: Create & push release tag
        env:
          VERSION: ${{ inputs.version }}
          FORCE_TESTS: ${{ inputs.forceTests }}
        run: |
          PKG_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts | head -n1)
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::dispatch version ($VERSION) != build.gradle.kts version ($PKG_VERSION)"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin
          TAG="v${VERSION}"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_SHA=$(git rev-list -n1 "$TAG"); HEAD_SHA=$(git rev-parse HEAD)
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "::notice::$TAG already on this commit → no-op (idempotent)"; exit 0
            fi
            echo "::error::$TAG exists but points to $TAG_SHA, not HEAD $HEAD_SHA"; exit 1
          fi
          # ADR 0053 修订 A2：forceTests 时打 annotated tag，消息带标记，tag-push 的发布 run 据此跑完整测试。
          if [ "$FORCE_TESTS" = "true" ]; then
            git tag -a "$TAG" -m "release-gate: force-tests"
          else
            git tag "$TAG"
          fi
          git push origin "$TAG"

  publish:
    # tag-push 路径（含 orchestrator create-tag 推的 tag）才真正发布。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # ADR 0053 修订 A2：门禁读本仓 CI run 与 job。
      actions: read
    steps:
      - uses: actions/checkout@v6

      # ADR 0053 修订 A2：发布的 commit 必须已在 main CI 上通过（本仓用本地路径，与 tag 同版本）。
      # catalog 没有测试可跑，force-tests 对本仓只意味着跳过门禁。
      - name: Require main CI green for this commit
        uses: ./.github/actions/require-main-ci-green

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      # Tag↔version guard (audit #32): the v* tag must match the platform's own
      # version literal in build.gradle.kts. Without this, a manually pushed
      # v1.0.14 on a 1.0.13 commit would publish/no-op under the wrong tag with no
      # error (create-tag's gate only runs on the dispatch path, not tag-push).
      # Mirrors the "Verify tag matches project version" step in aster-lang-test /
      # aster-lang-locales.
      - name: Verify tag matches project version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts | head -n1)
          echo "tag=$TAG  projectVersion=$PROJECT_VERSION"
          if [ "$TAG" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag v$TAG does not match project version $PROJECT_VERSION. Bump build.gradle.kts or fix the tag."
            exit 1
          fi

      # The catalog has no compiled code or deps — just generate + publish.
      - name: Publish version catalog to GitHub Packages
        run: ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

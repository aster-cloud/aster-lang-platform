name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 ref 上新 push 到来时取消尚在跑的过时 CI（PR 连续 push 常见）——省算力/排队。
# 该仓 CI 无发布/部署副作用（release 是独立 workflow），故可直接 cancel 过时 run。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：本 workflow 仅 checkout + build + 校验 catalog，无 push/release/评论/上传，
# 故只需只读仓库内容，撤销默认宽泛 GITHUB_TOKEN 写权限。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 防漂移 gate（ADR 0023 阶段6）：本仓即 plan/script 所在，直接对自身 root 校验
      # platform artifact（self version == platformVersion）。
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Release-plan drift gate
        run: |
          python3 scripts/release-plan/check-artifact.py \
            --plan release-plan.json --artifact platform --repo-root .

      # 发布列车执行器的回归测试（issue #85）：只依赖 bash + jq，gh/npm 由测试内 shim 顶替。
      - name: run-train.sh regression test
        run: bash scripts/release-plan/run-train.test.sh

      # ADR 0053：层内并行 / stale gate / deploy run 关联 / train manifest / cleanup 的回归测试。
      - name: train artifact-reuse regression test
        run: bash scripts/release-plan/train-reuse.test.sh

      # workflow 静态检查（review L12），钉死版本。
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 "$RUNNER_TEMP"
          # -shellcheck= ：只校验 workflow 结构/表达式。托管 runner 自带 shellcheck，会把各 workflow
          # 既有的 info 级提示（SC2086 等）也判失败——那是另一项治理，不在本门禁范围。
          "$RUNNER_TEMP/actionlint" -color -shellcheck=

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      # Catalog is just a generated TOML — building it validates the DSL
      # and that publishing wiring is intact. No tests to run.
      - name: Build + verify catalog generates
        run: ./gradlew build generateCatalogAsToml

      - name: Show generated catalog
        run: cat build/version-catalog/libs.versions.toml

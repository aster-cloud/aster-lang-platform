# ADR 0023 阶段3/5：发布列车 orchestrator。
#
# 读 release-plan.json（单一事实源）→ 按 releaseOrder 逐层发布全生态：
# platform → {core,runtime,validation,test} → {locales,hi} → truffle → {ts,aster-api}。
#
# 每层：preflight drift gate → 并行 dispatch 各 (repo,releaseWorkflow) → 等 tag 出现 →
# 等 tag-push release run 完成 → 等制品 registry 可见 → 进下一层。失败即停（forward-only，
# 已发布制品不回收）。dryRun 只打印计划不真发。
#
# ADR 0053 修订 A1：release-plan 里 pinOwner=train 的 service（aster-api）由列车在 L4 先 bump
# platform pin（开 PR → 等必需检查 → 合并）再部署。所需 GitHub App 凭据（repo variable
# TRAIN_PIN_APP_CLIENT_ID + secret TRAIN_PIN_APP_PRIVATE_KEY）见 docs/runbooks/train-pin-app.md。
# App 令牌 1 小时过期，所以 train job 分两段跑：pin 层之前一段，签发令牌，再跑 pin 层起一段。
#
# 前置：secret CROSS_REPO_TOKEN（**fine-grained** PAT——实测 token 前缀 github_pat_、
# 无 x-oauth-scopes 响应头；此处原注释误写为 classic，已更正。跨仓
# workflow_dispatch + 轮询 runs + 读 GH Packages 可见性）。
#
# 关键设计（Codex 交叉审查固化，见 ADR 0023 §4.2/§幂等）：
#  - 跨仓触发用 `gh workflow run --ref main`（GH Actions 无原生跨仓 needs，靠轮询）
#  - coalesce by (repo,releaseWorkflow)：locales/hi 的 Maven+npm 共用 release.yml 只 dispatch 一次
#  - 等的不是 dispatch run（它只建 tag），而是 tag-push 触发的 publish run（event=push）
#  - 制品可见性以 registry 为事实源（非 run history）：Maven 拉具体 metadata，npm view
#  - 幂等：tag 已存在且制品已可见 → skip（resume 安全）
name: Release Train

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: '只打印发布计划与 preflight，不真正 dispatch/发布'
        type: boolean
        default: true
      fromLayer:
        description: '从第几层开始（0-based，resume 用；默认 0）'
        type: string
        default: '0'
      trainId:
        description: 'release train 标识（审计；默认 run id）'
        type: string
        required: false
      cleanup:
        description: '列车结束后（成功或失败）清理本列车的临时制品与 tag-ref 缓存（ADR 0053 §9）'
        type: boolean
        default: true

concurrency:
  group: release-train
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      layers: ${{ steps.coalesce.outputs.layers }}
      # ADR 0053 修订 A1：第一个含 pinOwner=train step 的层（无则为空）；pre_pin_to = 它的前一层。
      pin_layer: ${{ steps.pinlayer.outputs.pin_layer }}
      pre_pin_to: ${{ steps.pinlayer.outputs.pre_pin_to }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Coalesce release-plan into (repo,workflow) layers
        id: coalesce
        run: |
          LAYERS=$(python3 scripts/release-plan/coalesce.py --plan release-plan.json | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin)))")
          echo "layers<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LAYERS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Print plan
        run: python3 scripts/release-plan/coalesce.py --plan release-plan.json
      - name: Locate train-owned pin layer (ADR 0053 A1)
        id: pinlayer
        env:
          LAYERS: ${{ steps.coalesce.outputs.layers }}
        run: |
          set -euo pipefail
          L=$(jq -r '[to_entries[] | select(any(.value[]; (.pinOwner // "human") == "train")) | .key] | first // empty' <<<"$LAYERS")
          PRE=""
          [ -z "$L" ] || PRE=$((L-1))
          echo "pin_layer=$L" >> "$GITHUB_OUTPUT"
          echo "pre_pin_to=$PRE" >> "$GITHUB_OUTPUT"
          echo "pin layer: ${L:-（无，pinOwner 全为 human）}"

  preflight:
    needs: plan
    runs-on: ubuntu-latest
    # stale gate（ADR 0053 §7）：drift gate 验过的各仓 main SHA，交给 train 在每次 dispatch 前比对。
    outputs:
      main_shas: ${{ steps.drift.outputs.main_shas }}
      # ADR 0053 修订 A1：bump=列车 L4 负责 bump aster-api pin；skip=main 已是目标版本；none=pinOwner human。
      api_pin_action: ${{ steps.drift.outputs.api_pin_action }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      # 全仓 drift gate：checkout 每个仓的 main，跑 check-artifact.py。任一漂移即停，
      # 不进发布。这是发布前最后一道防线（防 main 已漂移 / Renovate pin PR 未合）。
      - name: Drift gate across all artifacts
        id: drift
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          # ★owner=wontlost-ltd 的 fine-grained PAT（token 名 aster-cross-repo-wontlost）。
          #   fine-grained PAT 的 resource owner 只能选一个 org，故跨 org 必须两个 token。
          WONTLOST_TOKEN: ${{ secrets.CROSS_REPO_TOKEN_WONTLOST }}
        run: |
          set -euo pipefail
          PLAN=release-plan.json
          fail=0
          # pinOwner=train 的制品才会写这个文件；先建空文件，pinOwner 全为 human 时下面的读取不至于失败。
          : > /tmp/pin-actions.txt
          # artifact → (repo, org) 映射从 plan 读。
          # ★org 缺省 aster-cloud；aster-api 于 2026-08 迁至 wontlost-ltd 并转私。
          #   此前这里把 org 硬编码成 aster-cloud，clone 得 403
          #   "Write access to repository not granted"，而 `>/dev/null 2>&1` 把它吞掉，
          #   只在 job 层表现为 exit 128——无任何指向根因的信息。现在失败即打印真因。
          mapfile -t ROWS < <(python3 -c "
          import json
          d=json.load(open('$PLAN'))
          for a in d['artifacts']:
              print(a['id'], a['repo'], a.get('org', 'aster-cloud'))
          ")
          declare -A CLONED
          for row in "${ROWS[@]}"; do
            read -r ID REPO ORG <<< "$row"
            if [ -z "${CLONED[$REPO]:-}" ]; then
              # ★按 org 选令牌：aster-cloud 用 GH_TOKEN，wontlost-ltd 用 WONTLOST_TOKEN。
              #   用错 org 的 fine-grained PAT 会得到 404/403（看起来像"仓不存在"），
              #   故缺令牌时 fail-fast 并明确指出缺哪个 secret，绝不静默降级。
              if [ "$ORG" = "wontlost-ltd" ]; then
                TOK="$WONTLOST_TOKEN"
                if [ -z "$TOK" ]; then
                  echo "::error::[$ID] 目标 org=wontlost-ltd 但未配置 secret CROSS_REPO_TOKEN_WONTLOST（token 名 aster-cross-repo-wontlost）"
                  fail=1
                  continue
                fi
              else
                TOK="$GH_TOKEN"
              fi
              if ! git clone --depth 1 \
                   "https://x-access-token:${TOK}@github.com/${ORG}/${REPO}.git" \
                   "/tmp/$REPO" 2>/tmp/clone-err; then
                echo "::error::[$ID] clone ${ORG}/${REPO} 失败（下方为 git 原始报错，token 已脱敏）："
                sed -e "s#${TOK}#***#g" /tmp/clone-err >&2
                fail=1
                continue
              fi
              CLONED[$REPO]=1
              echo "$REPO $(git -C "/tmp/$REPO" rev-parse HEAD)" >> /tmp/main-shas.txt
            fi
            # --pin-action-file：pinOwner=train 的制品通过时写入「<id>=bump|skip」（ADR 0053 修订 A1 §3）。
            if ! python3 scripts/release-plan/check-artifact.py --plan "$PLAN" --artifact "$ID" --repo-root "/tmp/$REPO" \
                   --pin-action-file /tmp/pin-actions.txt; then
              fail=1
            fi
          done
          [ "$fail" = "0" ] || { echo "::error::preflight drift gate failed — 有 artifact 不符 release-plan，终止发布"; exit 1; }
          # 验过的 main SHA → JSON（repo→sha），train 每次 dispatch 前据此拦截列车途中的合入。
          MAIN_SHAS=$(python3 -c "import json;print(json.dumps(dict(l.split() for l in open('/tmp/main-shas.txt'))))")
          echo "main_shas=$MAIN_SHAS" >> "$GITHUB_OUTPUT"
          echo "preflight 验过的 main SHA：$MAIN_SHAS"
          API_PIN_ACTION=$(sed -n 's/^aster-api:service=//p' /tmp/pin-actions.txt | head -1)
          echo "api_pin_action=${API_PIN_ACTION:-none}" >> "$GITHUB_OUTPUT"
          echo "api_pin_action=${API_PIN_ACTION:-none}"
          echo "preflight drift gate: all artifacts match release-plan ✅"

      # ADR 0053 修订 A1 §7：api_pin_action=bump 时打印列车将在 L4 提交的 diff（只在本地 clone 里改，不推送）。
      - name: Preview aster-api pin bump
        if: ${{ steps.drift.outputs.api_pin_action != 'none' }}
        env:
          API_PIN_ACTION: ${{ steps.drift.outputs.api_pin_action }}
        run: |
          set -euo pipefail
          { echo '### aster-api pin（ADR 0053 修订 A1）'; echo "api_pin_action: \`$API_PIN_ACTION\`"; } >> "$GITHUB_STEP_SUMMARY"
          [ "$API_PIN_ACTION" = "bump" ] || exit 0
          TARGET=$(jq -r '.platformVersion' release-plan.json)
          python3 scripts/release-plan/bump-api-pin.py --repo-root /tmp/aster-api --write "$TARGET"
          DIFF=$(git -C /tmp/aster-api --no-pager diff)
          git -C /tmp/aster-api checkout -- .
          echo "$DIFF"
          { echo '```diff'; echo "$DIFF"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  train:
    needs: [plan, preflight]
    runs-on: ubuntu-latest
    # packages:read 让内置 GITHUB_TOKEN 能读本 org 的 GH Packages versions（可见性查询）。
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      # 第一段：pin 层之前的各层（无 pinOwner=train 时就是整趟列车）。
      - name: Run release train
        env:
          # 跨仓 dispatch/轮询用 CROSS_REPO_TOKEN（需 Actions+Contents 写）。owner=aster-cloud。
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          # ★owner=wontlost-ltd 的 fine-grained PAT（token 名 aster-cross-repo-wontlost）。
          #   目前唯一用到它的是层4 的 aster-api:service（dispatch deploy.yml + 轮询 run），
          #   故需 Actions: Read and write + Contents: Read。
          WONTLOST_TOKEN: ${{ secrets.CROSS_REPO_TOKEN_WONTLOST }}
          # 可见性查询（org GH Packages versions）用内置 GITHUB_TOKEN（packages:read）——
          # fine-grained CROSS_REPO_TOKEN 读 GH Packages 私有 Maven 受限，分离更健壮。
          VIS_TOKEN: ${{ github.token }}
          LAYERS: ${{ needs.plan.outputs.layers }}
          DRY_RUN: ${{ inputs.dryRun }}
          FROM_LAYER: ${{ inputs.fromLayer }}
          TO_LAYER: ${{ needs.plan.outputs.pre_pin_to }}
          TRAIN_ID: ${{ inputs.trainId || github.run_id }}
          MAIN_SHAS: ${{ needs.preflight.outputs.main_shas }}
          TRAIN_MANIFEST: ${{ runner.temp }}/train-manifest.json
        run: bash scripts/release-plan/run-train.sh

      # ADR 0053 修订 A1 §6：aster-api pin 由专用 GitHub App 推分支 / 开 PR / 合并（不需要规则集 bypass）。
      # 缺凭据 fail-closed，并指明要配什么（不静默回退到 PAT）。签发时刻交给 run-train.sh：
      # 安装令牌 1 小时过期，脚本在过期前 5 分钟停止写操作并提示 fromLayer 续跑。
      - name: Require train-pin App credentials
        id: pinreq
        if: ${{ needs.plan.outputs.pin_layer != '' }}
        env:
          CLIENT_ID: ${{ vars.TRAIN_PIN_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.TRAIN_PIN_APP_PRIVATE_KEY != '' }}
        run: |
          missing=""
          [ -n "$CLIENT_ID" ] || missing="repo variable TRAIN_PIN_APP_CLIENT_ID"
          [ "$HAS_KEY" = "true" ] || missing="${missing:+$missing 与 }secret TRAIN_PIN_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::release-plan 中 aster-api:service 为 pinOwner=train，但本仓缺少 $missing（GitHub App aster-train-pin，见 docs/runbooks/train-pin-app.md）。配置好再开车，或把 pinOwner 改回 human。"
            exit 1
          fi
          echo "issued_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      # dry-run 只申请读权限（contents/pull-requests/checks: read）；真发才申请写，并加 actions: write 用于超时重跑一次。
      # 空字符串的 permission-* 不会被申请（create-github-app-token 跳过空值）。
      - name: Mint aster-api pin token
        id: pintoken
        if: ${{ needs.plan.outputs.pin_layer != '' }}
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.TRAIN_PIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRAIN_PIN_APP_PRIVATE_KEY }}
          owner: wontlost-ltd
          repositories: aster-api
          permission-contents: ${{ inputs.dryRun && 'read' || 'write' }}
          permission-pull-requests: ${{ inputs.dryRun && 'read' || 'write' }}
          permission-checks: read
          permission-actions: ${{ !inputs.dryRun && 'write' || '' }}

      # 第二段：pin 层起的各层（含与 pin 同层的其它 step，如 ts:npm）。清单在第一段基础上续写。
      - name: Run release train (pin layer onward)
        if: ${{ needs.plan.outputs.pin_layer != '' }}
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          WONTLOST_TOKEN: ${{ secrets.CROSS_REPO_TOKEN_WONTLOST }}
          VIS_TOKEN: ${{ github.token }}
          LAYERS: ${{ needs.plan.outputs.layers }}
          DRY_RUN: ${{ inputs.dryRun }}
          INPUT_FROM_LAYER: ${{ inputs.fromLayer }}
          PIN_LAYER: ${{ needs.plan.outputs.pin_layer }}
          TRAIN_ID: ${{ inputs.trainId || github.run_id }}
          MAIN_SHAS: ${{ needs.preflight.outputs.main_shas }}
          TRAIN_MANIFEST: ${{ runner.temp }}/train-manifest.json
          PIN_TOKEN: ${{ steps.pintoken.outputs.token }}
          PIN_TOKEN_ISSUED_AT: ${{ steps.pinreq.outputs.issued_at }}
          PIN_APP_SLUG: ${{ steps.pintoken.outputs.app-slug }}
          TRAIN_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          FROM_LAYER=$(( INPUT_FROM_LAYER > PIN_LAYER ? INPUT_FROM_LAYER : PIN_LAYER )) \
            bash scripts/release-plan/run-train.sh

      # 列车清单（ADR 0053 §3/§8）：每个 step 的 repo/tag/commit/run。失败也上传（定位停在哪一层）。
      # 写进 job summary 一份（永久可查），制品本身由 cleanup job 删除，retention 7 天兜底。
      - name: Publish train manifest
        if: always()
        run: |
          f="${{ runner.temp }}/train-manifest.json"
          [ -f "$f" ] || { echo "无 manifest（列车未进入任何层）"; exit 0; }
          { echo '### Train manifest'; echo '```json'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload train manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: train-${{ inputs.trainId || github.run_id }}-manifest
          path: ${{ runner.temp }}/train-manifest.json
          if-no-files-found: ignore
          retention-days: 7

  # ADR 0053 §9：清理本列车的临时物（tag-ref 缓存 / 列车 deploy run 的中间制品 / 列车自身制品）。
  # if: always()——成功与失败都清；dryRun 列车只做 dry-run 清理（只列不删）。
  # 清理失败只告警（脚本内吞错），绝不把一次成功的列车变红。
  cleanup:
    needs: [plan, train]
    if: ${{ always() && inputs.cleanup && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # ADR 0053 修订 A1 §4：pin 合并后跟随的 push deploy run 标题不带 train <id>，按清单里的 run ID 补清。
      - name: Download train manifest
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: train-${{ inputs.trainId || github.run_id }}-manifest
          path: ${{ runner.temp }}/manifest
      - name: Clean train artifacts and tag-ref caches
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          WONTLOST_TOKEN: ${{ secrets.CROSS_REPO_TOKEN_WONTLOST }}
          LAYERS: ${{ needs.plan.outputs.layers }}
          TRAIN_ID: ${{ inputs.trainId || github.run_id }}
          TRAIN_RUN_ID: ${{ github.run_id }}
          PLATFORM_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dryRun }}
          # 列车失败时保留 service deploy 的中间制品（续跑复用源），其余照删。
          KEEP_RESUME: ${{ needs.train.result != 'success' }}
          TRAIN_MANIFEST: ${{ runner.temp }}/manifest/train-manifest.json
        run: bash scripts/release-plan/cleanup-train.sh

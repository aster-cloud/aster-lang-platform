# 自托管 Renovate（ADR 0023 阶段1：版本来源单一化）。
#
# 在本仓（版本来源 hub）跑 Renovate，autodiscover 全生态有 platform pin 的
# 6 个仓，自动 bump 各仓 settings.gradle(.kts) 的 aster-lang-platform version
# catalog pin（消除跨仓手工同步散点）。各仓的 renovate.json extends 本仓的共享
# preset（default.json），治理规则单点维护。
#
# 不装第三方托管 App——私有代码自托管更可控。
#
# 前置（一次性，平台侧）：org/仓库 secret `RENOVATE_TOKEN` = 一个 classic PAT，
# scope 至少 `repo`（扫私有仓+开 PR）+ `read:packages`（读 GitHub Packages 的
# 私有 Maven catalog artifact 以查询新版本）+ `workflow`（如需改 workflow 文件）。
# 该 token 也让 Renovate 自动为 *.pkg.github.com 生成认证，故 GH Packages 读权限
# 由它统一解决（preset 的 hostRules 只声明 host/type，token 来自这里）。
name: Renovate

on:
  schedule:
    # 每周一 04:00 UTC（接 nightly 之后，工作日早能看到 PR）
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate 日志级别（调试认证/匹配问题时设 debug）'
        required: false
        default: 'info'
        type: choice
        options: ['info', 'debug']

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # renovatebot/github-action 不发布移动式 major 标签（无 v46），只有完整版本
      # 标签（v46.1.16 等）；必须 pin 精确版本，否则 "unable to find version v46"。
      - uses: renovatebot/github-action@v46.1.16
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          # autodiscover 限定到全生态有 platform pin 的 6 个仓（避免扫无关仓）。
          # pin 仓 = api/core/truffle/locales/hi；platform 自身纳入以便未来 self-update。
          # ★用 regex 而非 brace-glob：env var 里逗号会被当成 filter 分隔符（官方文档），
          #   brace 列表会被拆散。regex 形如 /(orgA|orgB)\/(repo1|repo2|...)/。
          #
          # ★★org 部分必须同时匹配 aster-cloud 与 wontlost-ltd（wontlost-ltd/aster-api#80）：
          #   aster-api 已转移到 wontlost-ltd。GitHub 会把旧路径**重定向**到新仓
          #   （两边 repo id 相同，gh api 照常可达），所以从「能不能访问」看不出问题；
          #   但 autodiscover 是拿**当前 full_name** 去匹配 filter 的 ——
          #   转移后它是 wontlost-ltd/aster-api，被 ^aster-cloud\/ 直接拒掉。
          #
          #   实测证据（run 33381032968 的 "Autodiscovered repositories"）：
          #     只有 5 个 —— core / hi / locales / platform / truffle，**aster-api 不在其中**。
          #   后果：aster-api 的 platform pin 自 2026-07-20 起再未被 Renovate 检查，
          #   其 Dependency Dashboard 也停在那天（看起来"一切正常，只是没有更新"）。
          #
          #   ★这类失效**没有任何报错**：Renovate 只是少扫一个仓，日志全绿。
          #     判据是数「Autodiscovered repositories 列了几个」，而不是看有没有报错。
          RENOVATE_AUTODISCOVER: 'true'
          RENOVATE_AUTODISCOVER_FILTER: '/^(aster-cloud|wontlost-ltd)\/(aster-lang-platform|aster-api|aster-lang-core|aster-lang-truffle|aster-lang-locales|aster-lang-hi)$/'
          # GH Packages 私有 Maven 认证：实测发现 platform token **不会**自动覆盖
          # maven.pkg.github.com（日志 "hostRules: no authentication" + 401）——
          # 与文档"自动 provision"表述相反，自托管下 Maven datasource 需显式 hostRule。
          # 用 RENOVATE_HOST_RULES env 注入（token 来自 secret，永不进 git）。
          RENOVATE_HOST_RULES: '[{"matchHost":"maven.pkg.github.com","hostType":"maven","token":"${{ secrets.RENOVATE_TOKEN }}"}]'
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'info' }}

# cleanup-old-runs —— 清理超过 7 天的旧 workflow run
#
# GitHub 原生「log retention」只删日志不删 run 记录,故用本 workflow 主动删除。
# 每天 03:00 UTC 跑 + 可手动触发(workflow_dispatch)。
# 删除策略:created_at 早于 (now - RETENTION_DAYS) 的**已结束** run（跳过 in_progress/queued,
# 绝不删正在跑的）。跨所有 workflow、所有分支、所有状态。
# 权限最小:仅 actions:write（删 run 所需）。
#
# ★本文件是全生态的唯一实现（issue #86）：其余 aster 仓不再各留一份逐字副本，
#   而是通过 workflow_call 引用本文件——
#     jobs:
#       cleanup:
#         uses: aster-cloud/aster-lang-platform/.github/workflows/cleanup-old-runs.yml@main
#         permissions: { actions: write, contents: read }
#         with: { retention_days: '7', dry_run: 'false' }
#   被调用时 github.repository / github.token 均为**调用方**的，故删的是调用方的 run；
#   调用方必须显式授予 actions:write（被调用 workflow 不能自行提权）。
#
# ★翻页与删除的两条硬约束（issue #86，此前两处都做反了）：
#   1. actions/runs 按 created_at **倒序**返回——越后页越旧。所以「本页无更旧 run 就
#      提前停」的方向是反的：7 天内已完成 run 一超过 200 条，第 2 页即停，真正过期的
#      第 3 页起永远扫不到。唯一可靠的终止条件是**空页**。
#   2. 边扫边删会让后续页的 offset 前移，跳过一批 run。故先把全部待删 id 收集完，
#      再统一删除。

name: cleanup-old-runs

on:
  schedule:
    - cron: '0 3 * * *'   # 每天 03:00 UTC
  workflow_dispatch:
    inputs:
      retention_days:
        description: '保留天数（删除早于此的 run）'
        required: false
        default: '7'
      dry_run:
        description: 'dry-run（true=只列不删）'
        required: false
        default: 'false'
  workflow_call:
    inputs:
      retention_days:
        description: '保留天数（删除早于此的 run）'
        type: string
        required: false
        default: '7'
      dry_run:
        description: 'dry-run（true=只列不删）'
        type: string
        required: false
        default: 'false'

permissions:
  actions: write        # 删除 workflow run
  contents: read

concurrency:
  group: cleanup-old-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs older than retention window
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # inputs 上下文对 workflow_dispatch 与 workflow_call 都生效；schedule 时为空 → 取缺省。
          RETENTION_DAYS: ${{ inputs.retention_days || '7' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          cutoff="$(date -u -d "-${RETENTION_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)"
          echo "仓库: $REPO  保留天数: $RETENTION_DAYS  截止(早于则删): $cutoff  dry-run: $DRY_RUN"

          # 第一遍：只收集，不删。分页拉取全部 run（每页 100,最多 40 页=4000 条,
          # 足够覆盖一周以上积压），直到空页为止。
          to_delete=()
          skipped_active=0; scanned=0
          for page in $(seq 1 40); do
            runs="$(gh api "repos/${REPO}/actions/runs?per_page=100&page=${page}" \
                     --jq '.workflow_runs[] | [.id, .status, .created_at] | @tsv' 2>/dev/null || true)"
            [ -z "$runs" ] && break
            while IFS=$'\t' read -r id status created; do
              [ -z "$id" ] && continue
              scanned=$((scanned + 1))
              # 只删已结束的 run（completed）;跳过 in_progress/queued/waiting/requested/pending。
              if [ "$status" != "completed" ]; then
                skipped_active=$((skipped_active + 1)); continue
              fi
              # created_at 早于 cutoff → 待删。字符串比较对 ISO8601 UTC 有效。
              [[ "$created" < "$cutoff" ]] && to_delete+=("$id $created")
            done <<<"$runs"
          done
          echo "扫描 ${scanned} 条; 待删 ${#to_delete[@]}; 跳过进行中 ${skipped_active}。"

          # 第二遍：统一删除（此时不再翻页，offset 前移不会漏 run）。
          deleted=0
          for entry in "${to_delete[@]}"; do
            read -r id created <<<"$entry"
            if [ "$DRY_RUN" = "true" ]; then
              echo "  [dry-run] would delete run $id (created $created)"
            else
              gh api --method DELETE "repos/${REPO}/actions/runs/${id}" >/dev/null 2>&1 \
                && { echo "  deleted run $id (created $created)"; deleted=$((deleted + 1)); } \
                || echo "  ::warning::删除 run $id 失败（可能已删/无权限）"
            fi
          done

          echo "扫描 ${scanned} 条; 删除 ${deleted}; 跳过进行中 ${skipped_active}。"
          {
            echo "### cleanup-old-runs"
            echo "- 保留天数: ${RETENTION_DAYS}"
            echo "- 扫描: ${scanned} / 待删: ${#to_delete[@]} / 删除: ${deleted} / 跳过进行中: ${skipped_active}"
            echo "- dry-run: ${DRY_RUN}"
          } >> "$GITHUB_STEP_SUMMARY"
